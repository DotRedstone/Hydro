{% extends "layout/immersive.html" %}
{% block content %}
<div class="auth-page">
  <div class="account-auth-card account-auth-card--single">
    <div class="auth-card__main">
    <h1>{{ _('Finish your account') }}</h1>
    <p class="auth-card__lead">{{ _('The email is confirmed. Choose a username and a password, and you are in.') }}</p>
    <form method="POST" class="auth-form">
      <div class="row"><div class="columns">
        <label class="material textbox">
          {{ _('Email') }}
          <input name="mail" type="text" value="{{ mail }}" disabled>
        </label>
      </div></div>
      <div class="row"><div class="columns">
        <label class="material textbox">
          {{ _('Username') }}
          <input name="uname" value="{{ username or '' }}" type="text" autocomplete="username" {% if lockUsername %}readonly{% else %}autofocus{% endif %}>
        </label>
      </div></div>
      <div class="row"><div class="columns">
        <label class="material textbox">
          {{ _('Password') }}
          <input name="password" type="password" autocomplete="new-password" {% if lockUsername %}autofocus{% endif %}>
        </label>
      </div></div>
      <div class="row"><div class="columns">
        <label class="material textbox">
          {{ _('Repeat Password') }}
          <input name="verifyPassword" type="password" autocomplete="new-password">
        </label>
      </div></div>
      <div class="row"><div class="columns">
        <div class="text-center">
          <input type="submit" value="{{ _('Create Account') }}" class="expanded rounded primary button">
        </div>
      </div></div>
    </form>
    </div>
  </div>
</div>
{% endblock %}
